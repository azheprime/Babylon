<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <body >
        <div class="splash-parent"><img src="./splash.png"><progress id="progress" value="0" max="100"></progress></div>
        <div class="layout-root">
            <div id="layout-toolbar" class="layout-toolbar">
                <div class="toolbar-menu">
                    <svg class="icon icon-genduo1" aria-hidden="true">
                        <use xlink:href="#icon-genduo1"></use>
                    </svg>
                    <div class="drop-menu" style="display: none">
                        <div class="drop-menu-item" id="alert">
                            <span>返回项目列表</span>
                        </div>
                        <div class="drop-menu-item" id="dalert">
                            <span>新建项目</span>
                        </div>
                        <div class="drop-menu-item" id="calert">
                            <span>保存项目</span>
                        </div>
                        <div class="drop-menu-item" id="balert">
                            <span>分享项目</span>
                        </div>
                    </div>
                </div>
            </div>
            <div id="layout-hierarchy" class="layout-hierarchy">
                <div class="icon-example">
                    <svg class="icon icon-tuceng" aria-hidden="true">
                        <use xlink:href="#icon-tuceng"></use>
                    </svg>
                </div>
                <div class="hierarchy-search">
                    <div class="icon-example-search">
                        <svg class="icon icon-sousuo" aria-hidden="true">
                            <use xlink:href="#icon-sousuo"></use>
                        </svg>
                    </div>
                    <input
                        class="hierarchy-search-text-input"
                        id="hierarchy-search-text-input"
                        placeholder="搜索..."
                    />
                </div>
                <div id="hierarchy-list-ui-container"></div>
            </div>
            <div id="layout-viewport" class="layout-viewport">
            </div>
            <div id="layout-attributes" class="layout-attributes">
                <div class="layout-attributes-icon">
                    <svg class="icon icon-caidan2" aria-hidden="true">
                        <use xlink:href="#icon-caidan2"></use>
                    </svg>
                </div>
                <div class="layout-attributes-container"></div>
            </div>
            <div id="layout-assets" class="layout-assets">
                <div class="assets-header" id="assets-header">
                    <div class="assets-header-menu"><span>所有资源</span></div>
                    <div class="assets-header-menu-list">
                        <div
                            class="assets-header-menu-list-item"
                            data-type="all"
                        >
                            所有资源
                        </div>
                        <div
                            class="assets-header-menu-list-item"
                            data-type="material"
                        >
                            材质
                        </div>
                        <div
                            class="assets-header-menu-list-item"
                            data-type="model"
                        >
                            模型
                        </div>
                        <div
                            class="assets-header-menu-list-item"
                            data-type="texture"
                        >
                            贴图
                        </div>
                        <div
                            class="assets-header-menu-list-item"
                            data-type="table"
                        >
                            表格
                        </div>
                    </div>
                    <div class="assets-header-search">
                        <div class="icon-example">
                            <svg class="icon icon-sousuo" aria-hidden="true">
                                <use xlink:href="#icon-sousuo"></use>
                            </svg>
                        </div>
                        <input
                            class="assets-header-search-text-input"
                            id="assets-header-search-text-input"
                            placeholder="搜索..."
                        />
                    </div>
                    <div
                        id="assets-header-volume-container"
                        class="assets-header-volume-container"
                    >
                        <div class="assets-header-volume">
                            <div class="assets-header-volume-bar"></div>
                        </div>
                    </div>
                    <div class="assets-upload">
                        <svg class="icon icon-shangchuan" aria-hidden="true">
                            <use xlink:href="#icon-shangchuan"></use>
                        </svg>
                    </div>
                    <div class="assets-puzzle">
                        <svg class="icon icon-pintu" aria-hidden="true">
                            <defs>
                                <radialGradient id="myGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                                  <stop offset="0%" stop-color="#F9F536"/>
                                  <stop offset="33%" stop-color="rgba(255,252,94,0.86)"/>
                                  <stop offset="99%" stop-color="rgba(255,253,123,0.15)"/>
                                </radialGradient>
                              </defs>
                            <use
                                xlink:href="#icon-pintu
                            "
                            ></use>
                        </svg>
                    </div>
                </div>
                <div class="assets-floder" id="assets-floder"></div>
                <div class="assets-content" id="assets-content"></div>
            </div>
        </div>
        <div class="message-container"></div>
        <div
            class="asset-overlay"
            id="asset-overlay"
            style="display: none"
        ></div>
        <div id="context-menu" class="context"></div>
        <div id="drag" class="drag">测试对象668</div>
    </body>
    <script src="./vreditor.js"></script>
    <style>
        .icon {
            width: 1em;
            height: 1em;
            vertical-align: -0.15em;
            fill: currentColor;
            overflow: hidden;
        }
        .suo {
            font-size: 20px;
            color: #fff;
            position: absolute;
            right: 2px;
            top: 2px;
            z-index: 2;
        }
        .suo:hover {
            background-color: rgba(50, 50, 50, 0.5);
        }
        html {
            height: 100%;
            min-width: 1024px;
        }
        body {
            height: 100%;
            margin: 0;
            background-color: #323232;
            overflow: hidden;
        }
        .no-bar::-webkit-scrollbar{
            width:0px;
            height: 0px;
        }
        .no-bar{
            scrollbar-width: none;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #5f5f5f;
            border-radius: 4px;
        }
        .splash-parent{
            position: fixed;
            left: 0px;
            top: 0px;
            bottom: 0px;
            right: 0px;
            z-index: 999;
            background-color: #000;
        }
        .splash-parent img{
            width: 100%;
            height: 100%;
        }
        .splash-parent progress{
            position: absolute;
            left: 26%;
            bottom: 10%;
            height: 40px;
            width: 48%;
            margin-top: -100px;
        }
        /* ::-webkit-scrollbar-track {
            background: #5b7073;
        } */
        ::-webkit-scrollbar-corner {
            background: rgba(0, 0, 0, 0);
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none !important;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        input {
            outline: none;
            border: none !important;
        }
        .layout-root {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .layout-viewport {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            z-index: 1;
        }

        .layout-root .layout-assets {
            position: fixed;
            bottom: 16px;
            display: none;
            grid-template-columns: 295px auto;
            grid-template-rows: 36px auto;
            height: 234px;
            /* width: 71.042vw; */
            width: calc(100vw - 556px);
            left: 50%;
            transform:translateX(-50%);

            background: rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            justify-self: center;
            border-radius: 15px;
            grid-template-areas: "header header" "floder content";
            z-index: 4;
        }
        .asset-overlay {
            width: 100%;
            height: 100%;
            top: 0;
            position: absolute;
            z-index: 3;
            background-color: rgba(80, 88, 88, 0.7);
        }
        .assets-header {
            grid-area: header;
            width: 100%;
            height: 36px;
            background-color: #000;
            border-radius: 15px 15px 0 0;
            display: flex;
            position: relative;
        }
        .assets-header .assets-header-menu {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            width: 83px;
            height: 36px;
            font-size: 12px;
            color: #fff;
            user-select: none;
            cursor: pointer;
        }
        .assets-header .assets-header-menu span {
            min-width: 48px;
            margin-left: 13px;
            vertical-align: top;
            text-align: left;
        }
        .assets-header .assets-header-menu::after {
            content: "";
            margin-left: 3.5px;

            border-style: solid;
            border-width: 2.778427px 0 2.778427px 2.828427px;
            border-color: transparent transparent transparent #fff;
            z-index: 2;
        }
        .assets-header .assets-header-menu-show::after {
            border-style: solid;
            border-width: 2.82843px 2.843425px 0 2.843425px;
            border-color: #fff transparent transparent transparent;
        }
        .assets-header .assets-header-menu-list {
            display: none;
        }
        .assets-header .assets-header-menu-show ~ .assets-header-menu-list {
            display: block;
            position: absolute;
            top: 36px;
            left: 0;
            width: 83px;
            height: 196px;
            background: #000;
            border-radius: 0 0 0 15px;
            overflow: scroll;
            z-index: 1;
        }
        .assets-header
            .assets-header-menu-show
            ~ .assets-header-menu-list::-webkit-scrollbar {
            display: none;
        }
        .assets-header
            .assets-header-menu-show
            ~ .assets-header-menu-list
            .assets-header-menu-list-item {
            height: 30px;
            line-height: 30px;
            padding-left: 13px;
            width: 100%;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
        }
        .assets-header
            .assets-header-menu-show
            ~ .assets-header-menu-list
            .assets-header-menu-list-item:hover {
            background: #323232;
        }
        .assets-header .assets-header-search {
            display: flex;
            align-items: center;
            width: 208px;
            margin-top: 4px;
            height: 28px;
            background-color: #323232;
            border-radius: 7px;
            line-height: 28px;
        }
        .assets-header .assets-header-search .icon-example {
            margin-left: 18px;
            width: 12px;
            height: 12px;
        }
        .assets-header .assets-header-search .icon-example .icon-sousuo {
            vertical-align: top;
            font-size: 12px;
            color: #adadad;
        }
        .assets-header .assets-header-search-text-input {
            position: relative;
            margin-left: 8px;
            font-size: 12px;
            width: 164px;
            height: 17px;
            background-color: transparent;
            color: #adadad;
        }
        .assets-header .assets-header-volume-container {
            position: relative;
            margin-left: 17px;
            width: 64px;
            height: 100%;
        }
        .assets-header .assets-header-volume {
            position: relative;
            margin-top: 18px;
            width: 64px;
            height: 4px;
        }
        .assets-header .assets-header-volume::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 4px 64px;
            border-color: transparent transparent #ffffff transparent;
            cursor: pointer;
        }
        .assets-header-volume-bar {
            position: absolute;
            top: -3px;
            width: 5px;
            height: 10px;
            background: #ffffff;
            border-radius: 157px 157px 157px 157px;
            cursor: pointer;
        }

        .assets-header .assets-upload,
        .assets-header .assets-puzzle {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            right: 20px;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .assets-header .assets-puzzle .icon-pintu {
            font-size: 24px;
            fill: url(#myGradient)
        }

        .assets-header .assets-upload {
            width: 28px;
            height: 28px;
            font-size: 28px;
            vertical-align: top;
            right: 72px;
            color: #fff;
        }
        .assets-header .assets-upload .icon-shangchuan {
            vertical-align: top;
        }
        .assets-floder {
            position: relative;
            grid-area: floder;
            width: 295px;
            background-color: rgb(37, 37, 37);
            border-right: 2px solid rgb(33, 33, 33);
            overflow: auto;
            height: calc(100%-15px);
            box-sizing: border-box;
            line-height: 24px;
            border-radius: 0 0 0 15px;
        }
        .assets-content {
            grid-area: content;
            display: flex;
            flex-wrap: wrap;
            overflow: auto;
            height: calc(100% - 15px);
            width: calc(100%);
        }
        .assets-grid-item > .thumbnail {
            width: 48px;
            height: 48px;
            line-height: 48px;
            background-size: 48px 48px;
            text-align: center;
            color: rgb(91, 112, 115);
            margin: 2px auto 0;
            background-color: transparent;
            background-position: center center;
            background-repeat: no-repeat;
        }
        .assets-grid-item.selected > .thumbnail {
            color: white;
        }
        .assets-grid-item:hover > .thumbnail {
            color: white;
        }
        .assets-grid-item {
            color: rgb(177, 184, 186);
            margin-top: 13px;
            margin-left: 13px;
            outline: none;
            position: relative;
            transition: opacity 100ms ease 0s;
            width: 70px;
            height: 70px;
            border-radius: 4px 4px 4px 4px;
            border: 1px solid rgb(37, 37, 37);

            background-color: rgb(37, 37, 37);
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            cursor: pointer;
        }
        .assets-grid-item:first-child {
            margin-left: 9px;
        }
        .assets-grid-item:hover {
            background-color: rgb(81, 101, 99);
        }
        .assets-grid-item.selected:hover {
            /* background-color: rgb(111, 167, 179); */
        }
        .assets-grid-item.selected {
            /* background-color: rgb(128, 203, 196); */
            border: 1px solid #0052d9;
        }
        .assets-grid-item > .label {
            position: absolute;
            right: 0px;
            left: 0px;
            bottom: 1px;
            width: auto;
            max-width: 100px;
            max-height: 40px;
            line-height: 14px;
            font-size: 12px;
            text-align: center;
            white-space: nowrap;
            text-overflow: ellipsis;
            color: rgb(255, 255, 255);
            background-color: transparent;
            margin: 0px;
            padding: 0px 2px;
            overflow: hidden;
        }

        .assets-floder .iconfont {
            font-size: 13.5px;
            height: 24px;
            display: block;
            cursor: pointer;
            color: #b1b8ba;
            padding-left: 3px;
            padding-right: 8px;
        }
        /* .layout-hierarchy .iconfont:hover,
                .assets-floder .iconfont:hover {
                    background-color: #80cbc4;
                    color: #fff;
                } */

        .assets-floder .iconfont.selected,
        .assets-floder .iconfont.selected::before {
            background-color: #80cbc4;
            color: #fff;
        }
        .assets-floder .iconfont.active,
        .assets-floder .iconfont.active::before {
            color: #f60 !important;
        }

        .ui-tree-item {
            position: relative;
            width: 100%;
            box-sizing: border-box;
            color: #fff;
        }
        .ui-tree-item .ui-tree-li {
            position: relative;
            padding-left: 12px;
            display: flex;
            align-items: center;
            width: calc(100% - 15px);
            height: 22px;
            border: 1px solid transparent;
            border-radius: 7px;
            cursor: pointer;
        }
        .ui-input-li {
            padding-left: 12px;
            font-size: 14px;
            color: #b1b8ba;
            height: 30px;
            line-height: 30px;
            background-color: #364346;
            border: 8px;
            cursor: pointer;
        }
        .ui-input-li:hover {
            background-color: #2c393c;
        }
        .ui-tree-item .li-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 12px;
            height: 100%;
            cursor: pointer;
            position: absolute;
            left: 0px;
        }
        .ui-tree-item .li-icon .icon-helong {
            font-size: 30px;
        }
        .ui-tree-item .ui-tree-li:hover {
            background: rgba(0, 0, 0, 0.25);
        }
        .ui-tree-item .ui-tree-li.check::after {
            border: 4px solid #f60;
            left: 0px;
            width: calc(100% - 6px);
            height: 16px;
            position: absolute;
            content: "";
            border-radius: 7px;
        }
        .ui-tree-item .ui-tree-li.check-top::after {
            border-top: 4px solid #f60;
            /* border-top-color: #f60; */
            left: 0px;
            top: 0px;
            width: 100%;
            height: 20px;
            position: absolute;
            content: "";
        }
        .ui-tree-item .ui-tree-li.check-top {
            border-color: transparent;
        }

        .ui-tree-item .ui-tree-li.not-allow {
            cursor: not-allowed !important;
        }
        .ui-tree-item .ui-tree-li.active {
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.25);
        }
        .ui-tree-item .ui-tree-li .li-text {
            cursor: pointer;
            font-size: 12px;
            user-select: none;
        }
        .ui-tree-item .ui-tree-li.not-allow .li-text {
            cursor: not-allowed;
        }
        .ui-tree-item .ui-tree-item {
            padding-left: 12px;
        }
        .ui-tree-item .ui-tree-item:last-child::before {
            bottom: calc(100% - 11px);
        }
        /* .item-pre::after {
            content: "";
            position: absolute;
            width: 0px;
            height: 0px;
            top: 8px;
            left: 16px;
            border-style: solid;
            border-width: 0 0 4px 4px;
            border-color: transparent transparent #fff transparent;
            z-index: 2;
        } */
        .assets-floder .item-pre::after {
            background-color: #38474a;
            color: #b1b8ba;
        }
        /* .layout-hierarchy > .ui-tree-item {
                    margin-left: 10px;
                } */
        /* .item-pre-close::after {
            content: "";
            position: absolute;
            width: 0px;
            height: 0px;
            transform: translateY(-50%);
            top: 50%;
            left: 16px;
            border-style: solid;
            border-width: 2.828425px 0 2.828425px 4px;
            border-color: transparent transparent transparent #fff;
            z-index: 1;
        } */
        .assets-floder .item-pre-close::after {
            background-color: #38474a;
            color: #b1b8ba;
        }
        .item-pre-close .ui-tree-item {
            display: none;
        }
        .ui-attr-item {
            display: flex;
            flex-wrap: nowrap;
        }
        .ui-label {
            width: 27%;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #b1b8ba;
            margin: 3px;
            display: inline-block;
            line-height: 22px;
        }
        .ui-checkbox {
            background-color: #212125;
            border: 1px solid #c4c4c4;
            width: 14px;
            height: 14px;
            overflow: hidden;
            position: relative;
            margin: 7px 3px 3px 3px;
            display: inline-block;
            vertical-align: text-bottom;
            box-sizing: border-box;
            color: #fff;
            cursor: pointer;
        }
        .ui-checkbox.check {
            background-color: #9ba1a3;
        }
        .ui-checkbox.check::after {
            position: absolute;
            content: "\e643";
            font-family: "iconfont" !important;
            font-size: 12px;
            color: #2c393c;
        }
        .ui-text-field {
            /* border:1px solid #252525;
            background-color:#212121; */
            margin: 3px;
            box-sizing: border-box;
            color: #b1b8ba;
            height: 24px;
            font-size: 12px;
            line-height: 22px;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            width: 24px;
            position: relative;
        }
        .ui-text-field input {
            padding: 0 8px;
            height: 100%;
            line-height: 22px;
            font-size: 12px;
            color: #b1b8ba;
            width: calc(100% - 16px);
            background-color: #212121;
            vertical-align: text-top;
            position: absolute;
            z-index: 1;
        }
        .vec3 input:hover,
        .vec3 input:focus {
            z-index: 2;
        }
        .vec3::after {
            content: attr(placeholder);
            position: absolute;
            top: 0px;
            right: 0px;
            padding: 0 8px;
            line-height: 22px;
            font-size: 12px;
            pointer-events: none;
            color: #5b7073;
            white-space: nowrap;
            font-weight: 400;
            background-color: #212121;
            z-index: 1;
        }

        .fenge {
            width: 3px;
            height: 15px;
            background: #757575;
            margin-left: 15px;
            margin-right: 5px;
        }
        .point {
            position: absolute;
            width: 0px;
            height: 0px;
            padding: 2px;
            background-color: white;
            touch-action: none;
        }
        .context {
            position: absolute;
            color: #9ba1a3;
            line-height: 32px;
            box-sizing: border-box;
            z-index: 5;
            top: -100px;
        }
        .context_menu {
            cursor: pointer;
            border-left: 30px solid #303030;
            position: relative;
            min-width: 128px;
            background-color: #303030;
        }
        .context_menu > .item {
            border-bottom: 1px solid #353535;
        }
        .context_menu:hover {
            border-left: 30px solid #5b7073;
        }
        .context_menu:hover > .item {
            background-color: #5b7073;
            color: #fff;
        }
        .context_menu:last-child > .item {
            border-bottom: none;
        }
        .context_menu.child > .item::after {
            content: "";
            width: 0;
            height: 0;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            border-right: 6px solid #e9e9e9;
            position: absolute;
            right: 10px;
            top: 13px;
            transform: rotate(-180deg);
        }
        .context_menu:hover > .content {
            display: block;
        }
        .context_menu > .content {
            position: absolute;
            left: 100%;
            top: 0px;
            display: none;
        }
        .drag {
            position: absolute;
            display: none;
            background-color: #555;
            font-size: 12px;
            color: #aaa;
            padding: 2px 4px;
            border-radius: 5px;
            z-index: 3;
        }
    </style>
</html>
