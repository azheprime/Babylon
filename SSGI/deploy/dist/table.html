<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <title>表格编辑器</title>
    <link rel="icon" href="/favicon.ico" />

    <link rel='stylesheet' href='./lucky/plugins/css/pluginsCss.css' />
    <link rel='stylesheet' href='./lucky/plugins/plugins.css' />
    <link rel='stylesheet' href='./lucky/css/luckysheet.css' />
    <link rel='stylesheet' href='./lucky/assets/iconfont/iconfont.css' />
	
	<!-- //DO_20221228:表格编辑器 -->
	<script src="js/OSSTool.js"></script>
    <script src="./babylon/babylon.js"></script>
    <script src="./babylon/babylon.gui.min.js"></script>
	<script src="./vreditor.js"></script>
    <script src="./lucky/trandevice.js"></script>

    <script src="./js/axios.min.js"></script>
    <script src="./js/OSSTool.js"></script>

    <script src="./lucky/plugins/js/plugin.js"></script>

    <style>
        .savetext {
            float: right;
            margin-right: 20px;
            margin-top: 3px;
            width: 50px;
            color: rgb(90, 90, 90);
            transform: translateZ(1px);
            display: block;
        }

        .saveloading {
            float: right;
            margin-right: 10px;
            margin-top: 5px;
            width: 15px;
            height: 15px;
            border: 2px solid rgb(90, 90, 90);
            border-top-color: transparent;
            border-radius: 100%;
            animation: circle infinite 0.6s linear;
            display: none;
        }

        @keyframes circle {
            0% {
                transform: rotate(0);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>


</head>

<body>

    <div id="luckysheet" style="margin:0px;padding:0px;position:absolute;width:100%;height:100%;left: 0px;top: 0px;">
    </div>
    <div id="savestatus">
        <div id="savetext" class="savetext">已保存</div>
        <div id="saveloading" class="saveloading"></div>
    </div>

    <script src="./js/vrtable.js"></script>

	<!-- //DO_20221228:表格编辑器,中英文 -->
    <script>
        tranDeviceInit("sada");
    </script>
</body>

</html>
